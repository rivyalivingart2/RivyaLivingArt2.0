[build]
command = "npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22.23.2"
NPM_VERSION = "10.9.2"
RIVYA_REFERENCE_STORAGE = "netlify"
SITE_INDEXABLE = "false"

[context.production.environment]
RIVYA_ENV = "production"
RIVYA_REFERENCE_STORE = "rivya-references-production"

[context.deploy-preview.environment]
RIVYA_ENV = "preview"
RIVYA_VISUAL_PREVIEW = "1"
RIVYA_REFERENCE_STORE = "rivya-references-preview"

[context.branch-deploy.environment]
RIVYA_ENV = "preview"
RIVYA_VISUAL_PREVIEW = "1"
RIVYA_REFERENCE_STORE = "rivya-references-preview"
